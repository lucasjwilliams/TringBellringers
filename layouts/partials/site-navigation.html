{{ $current := .RelPermalink }}
<nav class="site-nav" role="navigation" aria-label="Main">
  <div class="site-nav-inner">
    <a href="{{ .Site.Home.RelPermalink }}" class="brand" aria-label="{{ .Site.Title }} home">
      {{ with .Site.Params.site_logo }}
        <img src="{{ relURL . }}" class="brand-logo" alt="" width="56" height="56">
      {{ end }}
      <span class="brand-text">
        <span class="brand-name">{{ .Site.Title }}</span>
      </span>
    </a>

    <button class="hamburger-btn" id="hamburger-btn" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="site-menu">
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
    </button>

    <div class="site-menu" id="site-menu">
      {{ with .Site.Menus.main }}
        <ul class="site-menu-list">
          {{ range . }}
            {{ $active := and (ne $current "/") (hasPrefix $current .URL) }}
            <li class="site-menu-item">
              <a class="site-menu-link {{ with .Params.class }}{{ . }}{{ end }}{{ if $active }} is-current{{ end }}" href="{{ .URL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a>
            </li>
          {{ end }}
        </ul>
      {{ end }}
    </div>
  </div>
</nav>

<script>
(function () {
  var btn = document.getElementById('hamburger-btn');
  var menu = document.getElementById('site-menu');
  var topbar = document.querySelector('.site-topbar');
  if (!btn || !menu) return;

  function openMenu() {
    menu.style.top = (topbar ? topbar.getBoundingClientRect().bottom : 0) + 'px';
    menu.classList.add('is-open');
    btn.setAttribute('aria-expanded', 'true');
    btn.classList.add('is-active');
    document.body.style.overflow = 'hidden';
  }

  function closeMenu() {
    menu.classList.remove('is-open');
    btn.setAttribute('aria-expanded', 'false');
    btn.classList.remove('is-active');
    document.body.style.overflow = '';
  }

  btn.addEventListener('click', function () {
    menu.classList.contains('is-open') ? closeMenu() : openMenu();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && menu.classList.contains('is-open')) { closeMenu(); btn.focus(); }
  });
})();
</script>
