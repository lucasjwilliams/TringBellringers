title = "Tring Bellringers"
baseURL = "https://tringbells.org/"
languageCode = "en-gb"
theme = ["ananke"]
resourceDir = "../resources"

DefaultContentLanguage = "en"
googleAnalytics = "G-DVSMVMTXEQ"

[pagination]
  pagerSize = 12

[sitemap]
  changefreq = "monthly"
  priority = 0.5
  filename = "sitemap.xml"

[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "static/images"
    target = "assets/images"

[params]
  text_color = ""
  author = ""
  favicon = "images/favicon.png"
  site_logo = "images/favicon.png"
  description = "Home of the Tring church bell ringers"
  background_color_class = "bg-tring"
  body_classes = "tring"
  mainSections = ["news"]
  custom_css = ["css/tring-custom.css"]

  email = "contact@tringbells.org"
  phone = "07716 113034"

  [[params.ringing_times]]
    day = "Tuesday"
    time = "19:00 – 20:00"
    label = "Learners’ session"
  [[params.ringing_times]]
    day = "Tuesday"
    time = "20:00 – 21:15"
    label = "General practice"
  [[params.ringing_times]]
    day = "Sunday"
    time = "09:30 – 10:00"
    label = "Morning ringing"

[menu]

  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 10

  [[menu.main]]
    name = "News"
    url = "/news/"
    weight = 30

  [[menu.main]]
    name = "History"
    url = "/history/"
    weight = 40

  [[menu.main]]
    name = "Weddings"
    url = "/weddings/"
    weight = 50

  [[menu.main]]
    name = "Contact"
    url = "/contact/"
    weight = 60

  [[menu.main]]
    name = "Learn to ring"
    url = "/join/"
    weight = 70
    [menu.main.params]
      class = "nav-cta"
